name: passkeys_windows
description: Windows implementation of the Corbado passkeys plugin. Manages the creation of passkeys on Windows devices.
homepage: https://docs.corbado.com/overview/welcome
repository: https://github.com/corbado/flutter-passkeys/tree/main/packages/passkeys/passkeys_windows
version: 2.10.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    implements: passkeys
    platforms:
      windows:
        #pluginClass: FlutterPasskeysPlugin
        dartPluginClass: PasskeysWindows

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  passkeys_platform_interface: ^2.3.1
  win32: ^5.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^11.0.1
  plugin_platform_interface: ^2.0.0
  very_good_analysis: ^5.0.0
